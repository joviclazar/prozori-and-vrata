<canvas
  #canvas
  (pointerdown)="onPointerDown($event)"
  (pointermove)="onPointerMove($event)"
  (pointerup)="onPointerUp($event)"
  (pointercancel)="onPointerUp($event)"
></canvas>

<div class="toolbar">
  <button type="button" (click)="clear()">Clear</button>
  <button type="button" (click)="save()">Save</button>
  <button type="button" (click)="fileInput.click()">Load</button>
  <input
    #fileInput
    type="file"
    accept=".json,application/json"
    hidden
    (change)="onFileSelected(fileInput)"
  />
  <span>{{ strokes().length }} strokes</span>
  <label>
    <input
      #segmentsToggle
      type="checkbox"
      [checked]="showSegments()"
      (change)="showSegments.set(segmentsToggle.checked)"
    />
    Segments
  </label>
  <label>
    <input
      #structureToggle
      type="checkbox"
      [checked]="showStructure()"
      (change)="showStructure.set(structureToggle.checked)"
    />
    Structure
  </label>
  @if (structure(); as s) {
    <span>{{ s.lines.length }} lines, {{ s.annotations.length }} annotations</span>
  }
  @if (showSegments() || showStructure()) {
    <label>
      Tolerance
      <input
        #toleranceSlider
        type="range"
        min="1"
        class="tolerance-slider"
        max="100"
        step="0.5"
        [value]="tolerance()"
        (input)="tolerance.set(toleranceSlider.valueAsNumber)"
      />
      {{ tolerance() }} px
    </label>
  }
  @if (loadError(); as error) {
    <span class="error">{{ error }}</span>
  }
</div>
